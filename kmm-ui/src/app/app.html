<mat-toolbar class="toolbar">
  <h1 class="title">{{ title }}</h1>
  @if (systemInfo.hasValue()) {
    <a class="app-version" routerLink="/system" [title]="'app.versionTitle' | transloco">{{
      systemInfo.value().version
    }}</a>
  }
  <nav class="navigation">
    @for (item of navigation; track item.path) {
      <a
        matButton
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ item.label | transloco }}</a
      >
    }
  </nav>
  <app-language-switch />
  <a
    matButton
    class="page-help"
    [href]="pageHelp()"
    target="_blank"
    rel="noopener"
    [title]="'app.pageHelpTitle' | transloco"
    [attr.aria-label]="'app.pageHelp' | transloco"
    >?</a
  >
</mat-toolbar>
<app-job-indicator />

<main class="content">
  <router-outlet />
</main>
