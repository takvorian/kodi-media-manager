<mat-toolbar class="toolbar">
  <h1 class="title">{{ title }}</h1>
  <nav class="navigation">
    @for (item of navigation; track item.path) {
      <a matButton [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ item.label }}</a>
    }
  </nav>
</mat-toolbar>
<app-job-indicator />

<main class="content">
  <router-outlet />
</main>
