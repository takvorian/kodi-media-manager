name: kodi-media-manager

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kmm
      MARIADB_USER: kmm
      MARIADB_PASSWORD: ${KMM_DB_PASSWORD:?KMM_DB_PASSWORD fehlt (siehe .env.example)}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD fehlt (siehe .env.example)}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Without the sources this is enough: docker compose pull && docker compose up -d. To build yourself: docker compose up -d --build
    image: takvorian/kodi-media-manager:${KMM_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runs with the rights of the owner of the media files (NAS: e.g. 1026:100 on Synology).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      KMM_DB_PASSWORD: ${KMM_DB_PASSWORD}
      KMM_ADMIN_USER: ${KMM_ADMIN_USER:-admin}
      KMM_ADMIN_PASSWORD: ${KMM_ADMIN_PASSWORD:?KMM_ADMIN_PASSWORD fehlt (siehe .env.example)}
      TZ: ${TZ:-Europe/Berlin}
      KMM_TMDB_API_KEY: ${KMM_TMDB_API_KEY:-}
      KMM_FANARTTV_API_KEY: ${KMM_FANARTTV_API_KEY:-}
      KMM_TVDB_API_KEY: ${KMM_TVDB_API_KEY:-}
      KMM_TRAKT_CLIENT_ID: ${KMM_TRAKT_CLIENT_ID:-}
      KMM_OMDB_API_KEY: ${KMM_OMDB_API_KEY:-}
      # Optional: values set here take precedence over the settings page and are locked there.
      KMM_TMDB_LANGUAGE: ${KMM_TMDB_LANGUAGE:-}
      KMM_ARTWORK_LANGUAGE: ${KMM_ARTWORK_LANGUAGE:-}
      KMM_PROXY_HOST: ${KMM_PROXY_HOST:-}
      KMM_PROXY_PORT: ${KMM_PROXY_PORT:-8080}
      KMM_PROXY_USERNAME: ${KMM_PROXY_USERNAME:-}
      KMM_PROXY_PASSWORD: ${KMM_PROXY_PASSWORD:-}
    ports:
      - "${KMM_PORT:-8080}:8080"
    volumes:
      - ${KMM_CONFIG_DIR:-./data/config}:/config
      - ${KMM_MEDIA_DIR:-./data/media}:/media

volumes:
  db-data:
