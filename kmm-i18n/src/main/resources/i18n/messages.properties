# Messages shown to the user, English (base and fallback for every language).
# Syntax: ICU MessageFormat subset, see MessageTemplate. The user interface has the same keys under "server.*"
# in kmm-ui/src/i18n/*.json; a test there makes sure every key below exists in both languages.

job.unexpectedError=Unexpected error
job.alreadyRunning.title=Job already running
job.alreadyRunning.detail={job} is already running.
job.notFound.title=Job not found
job.notFound.detail=There is no job with the ID {id}.

backup.import.title=Restore backup
backup.import.dryRunTitle=Restore backup (dry run)
migration.import.title=Ember import
migration.import.dryRunTitle=Ember import (dry run)

# Scrapers (kmm-plugin-api and kmm-plugins). {provider} is the name the user knows, e.g. TMDB or fanart.tv;
# {reason} and {errors} are messages of the network, the file system or yt-dlp and stay untranslated.
scraper.httpError={provider} responded with error {status}.
scraper.unreachable={provider} cannot be reached: {reason}
scraper.interrupted=The request to {provider} was interrupted.
scraper.requestInterrupted=The request was interrupted.
scraper.unexpectedResponse={provider} returned an unexpected response.
scraper.apiKeyRejected={provider} rejects the API key. Please check it under Settings → API keys.
scraper.rateLimitReached=The request limit of {provider} has been reached. Please try again later.
scraper.apiKeyMissing=An API key for {provider} is missing (Settings → API keys).
scraper.tvdb.credentialsRejected=TVDB rejects the API key or the PIN. Please check them under Settings → API keys.
scraper.tvdb.loginFailed=Logging in to TVDB failed (error {status}).
scraper.tvdb.noToken=TVDB returned no token when logging in.
scraper.tvdb.attribution=Metadata provided by TheTVDB. Please consider adding missing information or subscribing.
scraper.trakt.clientIdRejected=Trakt rejects the client ID. Please check it under Settings → API keys.
scraper.trakt.clientIdMissing=The client ID for Trakt is missing (Settings → API keys).
scraper.omdb.dailyLimitReached=The daily limit of the OMDb API key has been reached; it continues tomorrow.
scraper.moviepilot.unknownPageFormat=Moviepilot: The movie page has an unknown format.
scraper.ofdb.sitemapMissing=OFDb: The sitemap {path} is missing.
scraper.ofdb.noMovies=OFDb: The sitemaps no longer contain any movies.
scraper.televisiontunes.noAudioFile=TelevisionTunes delivers no audio file at {url} ({status}, {contentType}).
scraper.televisiontunes.downloadFailed=The theme music from TelevisionTunes could not be loaded: {reason}
scraper.televisiontunes.foreignTheme=“{source}” is not a theme music from TelevisionTunes.
scraper.youtube.notInitialized=YouTube: plugin not initialized.
scraper.youtube.ytDlpNotFound=YouTube: yt-dlp not found ({command}). Please install yt-dlp or configure it under kmm.plugins.settings.youtube.yt-dlp.
scraper.youtube.notAVideo=“{source}” is not a YouTube video.
scraper.youtube.noMp3=yt-dlp did not create an MP3. Is ffmpeg installed?
scraper.youtube.saveFailed=The theme music could not be saved: {reason}
scraper.youtube.ytDlpFailed=yt-dlp reports an error: {errors}
scraper.youtube.ytDlpNotRunning=yt-dlp does not run: {reason}
scraper.youtube.noTempDirectory=No temporary folder for the download: {reason}
