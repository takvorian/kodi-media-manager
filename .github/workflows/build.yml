name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Start von Hand unter Actions, etwa wenn ein Push keinen Lauf ausgelöst hat.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Die ffprobe-Tests in kmm-media laufen nur mit ffmpeg auf dem PATH.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  handbuch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build PDF
        working-directory: kmm-ui
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run handbuch:pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v5
        with:
          name: handbuch
          path: kmm-ui/target/handbuch/KMM-Handbuch.pdf
          if-no-files-found: error
          retention-days: 30

  installer:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jpackage braucht WiX 3 auf dem PATH. Die Programmdateien kommen ohne Installation aus.
      - name: Install WiX
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix314-binaries.zip"
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'Prüfsumme von WiX stimmt nicht' }
          Expand-Archive $zip "$env:RUNNER_TEMP\wix"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\wix"

      - name: Build installer
        shell: bash
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          ./mvnw -B -Pinstaller -DskipTests ${tag:+"-Dinstaller.app-version=${tag#v}"} package

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: kmm-app/target/installer/*.msi
          if-no-files-found: error
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: kodi-media-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
