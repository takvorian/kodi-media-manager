# Standalone mode: embedded H2 database, only reachable locally, without login.
# Another database can be set via spring.datasource.* (or SPRING_DATASOURCE_URL etc.).
spring:
  datasource:
    url: jdbc:h2:file:${kmm.home}/db/kmm
    username: sa
    password: ""

server:
  address: ${KMM_BIND_ADDRESS:127.0.0.1}

kmm:
  security:
    enabled: false
