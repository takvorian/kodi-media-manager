spring:
  application:
    name: Kodi Media Manager
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/{vendor}
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 200

server:
  port: ${KMM_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kmm:
  # Arbeitsverzeichnis für Datenbank (H2), Plugins und Cache
  home: ${KMM_HOME:${user.home}/.kodi-media-manager}
  plugins:
    directory: ${kmm.home}/plugins
    install-bundled: true
    settings:
      tmdb:
        # TMDB-API-Key (v3) oder Lese-Token (v4): https://www.themoviedb.org/settings/api
        api-key: ${KMM_TMDB_API_KEY:}
        language: ${KMM_TMDB_LANGUAGE:de-DE}
        certification-country: ${KMM_TMDB_CERTIFICATION_COUNTRY:DE}
      fanarttv:
        # Projekt-API-Key: https://fanart.tv/get-an-api-key/
        api-key: ${KMM_FANARTTV_API_KEY:}
        # optionaler persönlicher Key: neue Bilder erscheinen damit früher
        client-key: ${KMM_FANARTTV_CLIENT_KEY:}
  artwork:
    # Bilder dieser Sprache (ISO 639-1) erscheinen in der Auswahl zuerst
    preferred-language: ${KMM_ARTWORK_LANGUAGE:de}
    max-download-size: 25MB
  security:
    enabled: true
  jobs:
    # beendete Jobs, die in der Oberfläche sichtbar bleiben
    history-size: 50
    # Mindestabstand zwischen Fortschrittsmeldungen eines Jobs
    progress-interval: 250ms
    # Lebenszeichen auf offenen SSE-Verbindungen
    heartbeat-interval: 30s
