spring:
  application:
    name: Kodi Media Manager
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    # The Ember profile is uploaded; its database grows with the library.
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 200

server:
  port: ${KMM_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kmm:
  # Working directory for database (H2), plugins and cache
  home: ${KMM_HOME:${user.home}/.kodi-media-manager}
  plugins:
    directory: ${kmm.home}/plugins
    install-bundled: true
    # API keys are kept in the settings store ("Settings" page). The values here only fill a key that has
    # not been saved yet at startup; after that the saved one applies.
    settings:
      tmdb:
        # TMDB API key (v3) or read access token (v4): https://www.themoviedb.org/settings/api
        api-key: ${KMM_TMDB_API_KEY:}
        certification-country: ${KMM_TMDB_CERTIFICATION_COUNTRY:DE}
      fanarttv:
        # Project API key: https://fanart.tv/get-an-api-key/
        api-key: ${KMM_FANARTTV_API_KEY:}
        # optional personal key: new artwork shows up earlier with it
        client-key: ${KMM_FANARTTV_CLIENT_KEY:}
      tvdb:
        # Project key of the TVDB API v4: https://thetvdb.com/api-information
        api-key: ${KMM_TVDB_API_KEY:}
        # PIN of a TVDB subscription, only needed for subscriber keys
        pin: ${KMM_TVDB_PIN:}
      omdb:
        # OMDb API key (free: 1,000 requests a day): https://www.omdbapi.com/apikey.aspx
        api-key: ${KMM_OMDB_API_KEY:}
      trakt:
        # Client ID of your own Trakt app for the public ratings: https://trakt.tv/oauth/applications
        client-id: ${KMM_TRAKT_CLIENT_ID:}
      youtube:
        # yt-dlp for theme music from YouTube: https://github.com/yt-dlp/yt-dlp; without a path from the search path
        yt-dlp: ${KMM_YTDLP:yt-dlp}
        # Folder of ffmpeg for converting to MP3; empty if ffmpeg is on the search path
        ffmpeg-location: ${KMM_FFMPEG_LOCATION:}
  settings:
    # Values set here take precedence over the settings in the user interface and are locked there.
    # Language of the metadata when scraping, e.g. de-DE
    metadata-language: ${KMM_TMDB_LANGUAGE:}
    # Artwork in this language (ISO 639-1) comes first in the selection, e.g. de
    artwork-language: ${KMM_ARTWORK_LANGUAGE:}
    # HTTP proxy for online services
    proxy-host: ${KMM_PROXY_HOST:}
    proxy-port: ${KMM_PROXY_PORT:8080}
    proxy-username: ${KMM_PROXY_USERNAME:}
    proxy-password: ${KMM_PROXY_PASSWORD:}
  scraping:
    # Metadata scraper for automatic scraping (fallback: the first one configured)
    preferred-metadata-scraper: tmdb
    # TV show scraper for automatic scraping (fallback: the first one configured)
    preferred-tv-show-scraper: tvdb
  artwork:
    max-download-size: 25MB
  kodi:
    # Delay after a change before KMM updates Kodi; combines metadata and artwork
    sync-delay: 5s
    connect-timeout: 5s
    request-timeout: 15s
    # Kodi runs only one scan at a time; this is the longest KMM waits for it to end
    scan-wait-interactive: 10s
    scan-wait-background: 30m
    scan-poll-interval: 1s
  security:
    enabled: true
  jobs:
    # finished jobs that stay visible in the user interface
    history-size: 50
    # minimum interval between progress reports of a job
    progress-interval: 250ms
    # keep-alive on open SSE connections
    heartbeat-interval: 30s
