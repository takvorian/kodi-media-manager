spring:
  application:
    name: Kodi Media Manager
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/{vendor}
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 200

server:
  port: ${KMM_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kmm:
  # Arbeitsverzeichnis für Datenbank (H2), Plugins und Cache
  home: ${KMM_HOME:${user.home}/.kodi-media-manager}
  plugins:
    directory: ${kmm.home}/plugins
    install-bundled: true
    # API-Keys stehen im Einstellungsspeicher (Seite „Einstellungen“). Die Werte hier füllen nur einen
    # noch nicht gespeicherten Key beim Start; danach gilt der gespeicherte.
    settings:
      tmdb:
        # TMDB-API-Key (v3) oder Lese-Token (v4): https://www.themoviedb.org/settings/api
        api-key: ${KMM_TMDB_API_KEY:}
        certification-country: ${KMM_TMDB_CERTIFICATION_COUNTRY:DE}
      fanarttv:
        # Projekt-API-Key: https://fanart.tv/get-an-api-key/
        api-key: ${KMM_FANARTTV_API_KEY:}
        # optionaler persönlicher Key: neue Bilder erscheinen damit früher
        client-key: ${KMM_FANARTTV_CLIENT_KEY:}
      tvdb:
        # Projekt-Key der TVDB-API v4: https://thetvdb.com/api-information
        api-key: ${KMM_TVDB_API_KEY:}
        # PIN eines TVDB-Abonnements, nur bei Keys für Abonnenten nötig
        pin: ${KMM_TVDB_PIN:}
  settings:
    # Gesetzte Werte haben Vorrang vor den Einstellungen in der Oberfläche und sind dort gesperrt.
    # Sprache der Metadaten beim Scrapen, z. B. de-DE
    metadata-language: ${KMM_TMDB_LANGUAGE:}
    # Bilder dieser Sprache (ISO 639-1) erscheinen in der Auswahl zuerst, z. B. de
    artwork-language: ${KMM_ARTWORK_LANGUAGE:}
    # HTTP-Proxy für Online-Dienste
    proxy-host: ${KMM_PROXY_HOST:}
    proxy-port: ${KMM_PROXY_PORT:8080}
    proxy-username: ${KMM_PROXY_USERNAME:}
    proxy-password: ${KMM_PROXY_PASSWORD:}
  scraping:
    # Metadaten-Scraper für das automatische Scrapen (Fallback: erster eingerichteter)
    preferred-metadata-scraper: tmdb
    # Serien-Scraper für das automatische Scrapen (Fallback: erster eingerichteter)
    preferred-tv-show-scraper: tvdb
  artwork:
    max-download-size: 25MB
  kodi:
    # Wartezeit nach einer Änderung, bevor KMM Kodi aktualisiert; fasst Metadaten und Bilder zusammen
    sync-delay: 5s
    connect-timeout: 5s
    request-timeout: 15s
  security:
    enabled: true
  jobs:
    # beendete Jobs, die in der Oberfläche sichtbar bleiben
    history-size: 50
    # Mindestabstand zwischen Fortschrittsmeldungen eines Jobs
    progress-interval: 250ms
    # Lebenszeichen auf offenen SSE-Verbindungen
    heartbeat-interval: 30s
